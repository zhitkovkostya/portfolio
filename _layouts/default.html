<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
    <link href="{{ '/assets/styles/main.css' | relative_url }}" rel="stylesheet" />
</head>
<body>
    <aside class="aside">
        <ul class="tag-cloud js-tag-cloud"></ul>
    </aside>
    <main class="main">
        {{ content }}
    </main>

    <script src="{{ '/assets/libs/swiper/swiper.min.js' | relative_url }}?v=1"></script>
    <script src="{{ '/assets/scripts/main.js' | relative_url }}?v=1"></script>
</body>
</html>
